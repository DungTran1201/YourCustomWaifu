<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YourCustomWaifu — Avatar Stage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #stage-root {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    #stage-canvas {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      display: block;
      pointer-events: auto;
    }

    /* Minimal Floating Toolbar */
    .stage-toolbar {
      position: absolute;
      top: 14px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: rgba(20, 21, 25, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 200ms ease, transform 200ms ease;
      pointer-events: auto;
    }

    #stage-root:hover .stage-toolbar,
    .stage-toolbar:focus-within,
    .stage-toolbar.always-show {
      opacity: 1;
      transform: translateY(0);
    }

    .drag-handle {
      -webkit-app-region: drag;
      cursor: grab;
      padding: 4px 8px;
      color: #A4A7AF;
      font-size: 0.85rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 150ms ease;
    }

    .drag-handle:hover {
      color: #F1F2F4;
    }

    .tool-btn {
      -webkit-app-region: no-drag;
      cursor: pointer;
      background: transparent;
      border: none;
      outline: none;
      color: #A4A7AF;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: all 150ms ease;
    }

    .tool-btn:hover {
      color: #F1F2F4;
      background: rgba(255, 255, 255, 0.1);
    }

    .tool-btn.active {
      color: #F1F2F4;
      background: rgba(255, 255, 255, 0.16);
    }

    .tool-separator {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* Loading Overlay */
    .stage-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      background: rgba(20, 21, 25, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #F1F2F4;
      font-size: 0.85rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .stage-overlay.hidden {
      display: none;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: #F1F2F4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error Overlay */
    .stage-error-overlay {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      z-index: 60;
      background: rgba(30, 20, 20, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #F1F2F4;
      font-size: 0.825rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .stage-error-overlay.hidden {
      display: none;
    }

    .error-action-btn {
      padding: 5px 12px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .stage-fallback-badge {
      position: absolute;
      bottom: 12px;
      z-index: 40;
      padding: 4px 12px;
      background: rgba(20, 21, 25, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      font-size: 0.725rem;
      color: #a4a7ae;
      pointer-events: none;
      transition: opacity 200ms ease;
    }

    .stage-fallback-badge.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="stage-root">
    <!-- 3D Canvas -->
    <canvas id="stage-canvas"></canvas>

    <!-- Floating Minimal Toolbar -->
    <div id="stage-toolbar" class="stage-toolbar">
      <!-- Drag Grip Handle -->
      <div id="btn-drag-handle" class="drag-handle" title="Drag to move Stage">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
      </div>

      <div class="tool-separator"></div>

      <!-- Scale Adjust -->
      <button id="btn-scale-down" class="tool-btn" title="Decrease Avatar Scale">−</button>
      <button id="btn-scale-up" class="tool-btn" title="Increase Avatar Scale">+</button>

      <div class="tool-separator"></div>

      <!-- Always on top toggle -->
      <button id="btn-always-on-top" class="tool-btn active" title="Toggle Always On Top">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-2l-2-2V5h1V3H6v2h1v8l-2 2v2z"></path></svg>
      </button>

      <!-- Click-through toggle -->
      <button id="btn-click-through" class="tool-btn" title="Toggle Click-Through Mode (Ctrl+Shift+M)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7 18 3-7 7-3L3 3z"></path></svg>
      </button>

      <!-- Pause / Resume animation -->
      <button id="btn-pause-animation" class="tool-btn" title="Pause/Resume Motion">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
      </button>

      <!-- Global Eye Tracking toggle -->
      <button id="btn-toggle-lookat" class="tool-btn active" title="Toggle Global Eye/Gaze Tracking">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>

      <!-- Test Blink button -->
      <button id="btn-test-blink" class="tool-btn" title="Test Blink (Trigger natural eye blink)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10s3-5 10-5 10 5 10 5"></path><path d="M2 14l3-2"></path><path d="M22 14l-3-2"></path><path d="M12 17v-3"></path><path d="M7 16l1.5-2.5"></path><path d="M17 16l-1.5-2.5"></path></svg>
      </button>

      <div class="tool-separator"></div>

      <!-- Open Workspace button -->
      <button id="btn-open-workspace" class="tool-btn" title="Open Companion Workspace">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </button>

      <!-- Open Avatar Settings button -->
      <button id="btn-open-settings" class="tool-btn" title="Open Avatar Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>

      <div class="tool-separator"></div>

      <!-- Hide Stage -->
      <button id="btn-hide-stage" class="tool-btn" title="Hide Avatar Stage">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Loading Indicator -->
    <div id="stage-loading" class="stage-overlay hidden">
      <div class="spinner"></div>
      <span id="stage-loading-text">Loading VRM Avatar...</span>
    </div>

    <!-- Fallback Indicator -->
    <div id="stage-fallback-notice" class="stage-fallback-badge hidden">
      No VRM loaded — displaying fallback mannequin
    </div>

    <!-- Error Banner -->
    <div id="stage-error" class="stage-error-overlay hidden">
      <span id="stage-error-message">Unable to load VRM model</span>
      <div class="error-actions" style="display: flex; gap: 6px;">
        <button id="stage-error-retry-btn" class="error-action-btn" style="background: rgba(255,255,255,0.15);">Retry</button>
        <button id="stage-error-settings-btn" class="error-action-btn">Settings</button>
      </div>
    </div>
  </div>

  <script type="module" src="./avatar-stage/stage-main.ts"></script>
</body>
</html>
