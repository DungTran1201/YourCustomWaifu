<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YourCustomWaifu — Avatar Stage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #stage-root {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    #stage-canvas {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      display: block;
      pointer-events: auto;
    }

    /* Side-Mounted Kebab Trigger */
    .stage-kebab-trigger {
      position: absolute;
      right: 0;
      top: 45%;
      transform: translateY(-50%);
      width: 34px;
      height: 40px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 21, 25, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-right: none;
      border-radius: 8px 0 0 8px;
      color: #A4A7AF;
      box-shadow: -2px 4px 16px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      pointer-events: auto;
      transition: all 150ms ease;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: no-drag;
    }

    .stage-kebab-trigger:hover {
      color: #F1F2F4;
      background: rgba(30, 33, 40, 0.96);
      box-shadow: -3px 6px 20px rgba(0, 0, 0, 0.55);
    }

    .stage-kebab-trigger:active,
    .stage-kebab-trigger.active {
      color: #06B6D4;
      background: rgba(18, 20, 26, 0.98);
      border-color: rgba(6, 182, 212, 0.45);
    }

    .stage-kebab-trigger:focus-visible {
      outline: 2px solid #06B6D4;
      outline-offset: -2px;
    }

    .stage-kebab-trigger svg {
      pointer-events: none;
    }

    /* Flyout Menu */
    .stage-flyout-menu {
      position: absolute;
      right: 42px;
      top: 45%;
      transform: translateY(-50%);
      width: 226px;
      z-index: 110;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: rgba(18, 20, 24, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: no-drag;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .stage-flyout-menu.hidden {
      display: none !important;
    }

    .menu-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-section-label {
      font-size: 0.675rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #717684;
      padding: 2px 6px 0;
    }

    .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 2px 0;
    }

    /* Drag Action inside Menu */
    .menu-action-btn.drag-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.05);
      color: #F1F2F4;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: grab;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      transition: all 150ms ease;
      -webkit-app-region: no-drag;
    }

    .menu-action-btn.drag-action:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(6, 182, 212, 0.5);
    }

    .menu-action-btn.drag-action:active,
    .menu-action-btn.drag-action.dragging {
      cursor: grabbing;
      color: #06B6D4;
      background: rgba(6, 182, 212, 0.15);
      border-color: #06B6D4;
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-hint {
      font-size: 0.65rem;
      color: #717684;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
    }

    /* Window Size Preset Buttons */
    .preset-btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .preset-btn {
      padding: 5px 0;
      font-size: 0.725rem;
      font-weight: 500;
      color: #A4A7AF;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 150ms ease;
      outline: none;
    }

    .preset-btn:hover {
      color: #F1F2F4;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .preset-btn:active,
    .preset-btn.active {
      background: rgba(6, 182, 212, 0.2);
      color: #06B6D4;
      border-color: rgba(6, 182, 212, 0.45);
    }

    .preset-btn:focus-visible {
      outline: 2px solid #06B6D4;
      outline-offset: -1px;
    }

    /* Avatar Scale Adjust */
    .scale-control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 2px 4px;
    }

    .scale-adjust-btn {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #A4A7AF;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      transition: all 150ms ease;
      outline: none;
    }

    .scale-adjust-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #F1F2F4;
    }

    .scale-adjust-btn:focus-visible {
      outline: 2px solid #06B6D4;
      outline-offset: -1px;
    }

    .scale-value {
      font-size: 0.75rem;
      font-weight: 600;
      color: #F1F2F4;
      min-width: 44px;
      text-align: center;
    }

    /* Menu Toggle and Action Buttons */
    .menu-toggle-btn,
    .menu-action-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 6px 8px;
      font-size: 0.775rem;
      font-weight: 500;
      color: #C2C5CC;
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 150ms ease;
      outline: none;
    }

    .menu-toggle-btn:hover,
    .menu-action-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #F1F2F4;
    }

    .menu-toggle-btn:focus-visible,
    .menu-action-btn:focus-visible {
      outline: 2px solid #06B6D4;
      outline-offset: -1px;
    }

    .menu-toggle-btn.active {
      color: #06B6D4;
      background: rgba(6, 182, 212, 0.12);
    }

    .menu-action-btn.action-danger:hover {
      color: #EF4444;
      background: rgba(239, 68, 68, 0.12);
    }

    .menu-options {
      gap: 2px;
    }

    /* Loading Overlay */
    .stage-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      background: rgba(20, 21, 25, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #F1F2F4;
      font-size: 0.85rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .stage-overlay.hidden {
      display: none;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: #F1F2F4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error Overlay */
    .stage-error-overlay {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      z-index: 60;
      background: rgba(30, 20, 20, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #F1F2F4;
      font-size: 0.825rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .stage-error-overlay.hidden {
      display: none;
    }

    .error-action-btn {
      padding: 5px 12px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .stage-fallback-badge {
      position: absolute;
      bottom: 12px;
      z-index: 40;
      padding: 4px 12px;
      background: rgba(20, 21, 25, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      font-size: 0.725rem;
      color: #a4a7ae;
      pointer-events: none;
      transition: opacity 200ms ease;
    }

    .stage-fallback-badge.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="stage-root">
    <!-- 3D Canvas -->
    <canvas id="stage-canvas"></canvas>

    <!-- Native Window Resize Handles (8 directions) -->
    <div class="stage-resize-handle resize-n" data-direction="n" title="Resize window top"></div>
    <div class="stage-resize-handle resize-s" data-direction="s" title="Resize window bottom"></div>
    <div class="stage-resize-handle resize-w" data-direction="w" title="Resize window left"></div>
    <div class="stage-resize-handle resize-e" data-direction="e" title="Resize window right"></div>
    <div class="stage-resize-handle resize-nw" data-direction="nw" title="Resize window top-left"></div>
    <div class="stage-resize-handle resize-ne" data-direction="ne" title="Resize window top-right"></div>
    <div class="stage-resize-handle resize-sw" data-direction="sw" title="Resize window bottom-left"></div>
    <div class="stage-resize-handle resize-se" data-direction="se" title="Resize window bottom-right">
      <svg class="resize-grip-icon" width="10" height="10" viewBox="0 0 10 10" fill="none">
        <line x1="8" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="8" y1="5" x2="5" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="8" y1="8" x2="8" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Side-Mounted Kebab Trigger -->
    <button id="btn-stage-kebab" class="stage-kebab-trigger" aria-label="Avatar Stage Menu" aria-expanded="false" aria-haspopup="true" title="Avatar Stage Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="5" r="2.2" />
        <circle cx="12" cy="12" r="2.2" />
        <circle cx="12" cy="19" r="2.2" />
      </svg>
    </button>

    <!-- Side Kebab Flyout Menu -->
    <div id="stage-kebab-menu" class="stage-flyout-menu hidden" role="menu" aria-label="Stage Controls">
      <!-- 1. Window Movement -->
      <div class="menu-section">
        <div id="btn-move-stage" class="menu-action-btn drag-action" title="Drag to move Stage window">
          <div class="action-left">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="5 9 2 12 5 15"></polyline>
              <polyline points="9 5 12 2 15 5"></polyline>
              <polyline points="15 19 12 22 9 19"></polyline>
              <polyline points="19 9 22 12 19 15"></polyline>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <line x1="12" y1="2" x2="12" y2="22"></line>
            </svg>
            <span>Move Stage</span>
          </div>
          <span class="action-hint">Drag</span>
        </div>
      </div>

      <div class="menu-divider"></div>

      <!-- 2. Window Size Presets (changes native BrowserWindow bounds) -->
      <div class="menu-section">
        <div class="menu-section-label">Window Size</div>
        <div class="preset-btn-group">
          <button type="button" class="preset-btn" data-preset="small" title="Small Window (300 × 460)">Small</button>
          <button type="button" class="preset-btn" data-preset="medium" title="Medium Window (420 × 640)">Medium</button>
          <button type="button" class="preset-btn" data-preset="large" title="Large Window (560 × 840)">Large</button>
        </div>
      </div>

      <div class="menu-divider"></div>

      <!-- 3. Avatar Scale (changes 3D model transform only) -->
      <div class="menu-section">
        <div class="menu-section-label">Avatar Scale</div>
        <div class="scale-control-group">
          <button type="button" id="btn-scale-down" class="scale-adjust-btn" title="Decrease 3D Avatar Scale" aria-label="Decrease 3D Avatar Scale">−</button>
          <span id="scale-value-display" class="scale-value">100%</span>
          <button type="button" id="btn-scale-up" class="scale-adjust-btn" title="Increase 3D Avatar Scale" aria-label="Increase 3D Avatar Scale">+</button>
        </div>
      </div>

      <div class="menu-divider"></div>

      <!-- 4, 5, 6. Stage Toggles -->
      <div class="menu-section menu-options">
        <button type="button" id="btn-always-on-top" class="menu-toggle-btn active" role="menuitemcheckbox" aria-checked="true" title="Toggle Always On Top">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-2l-2-2V5h1V3H6v2h1v8l-2 2v2z"></path></svg>
          <span>Always on Top</span>
        </button>

        <button type="button" id="btn-click-through" class="menu-toggle-btn" role="menuitemcheckbox" aria-checked="false" title="Click-Through Mode (Ctrl+Shift+M or System Tray to toggle)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7 18 3-7 7-3L3 3z"></path></svg>
          <span>Click-Through</span>
        </button>

        <button type="button" id="btn-pause-animation" class="menu-toggle-btn" role="menuitemcheckbox" aria-checked="false" title="Pause or Resume Motion">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          <span id="label-pause-animation">Pause Motion</span>
        </button>
      </div>

      <div class="menu-divider"></div>

      <!-- 7, 8. Workspace & Stage Lifecycle Actions -->
      <div class="menu-section menu-options">
        <button type="button" id="btn-open-workspace" class="menu-action-btn" role="menuitem" title="Open Companion Workspace">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span>Open Workspace</span>
        </button>

        <button type="button" id="btn-hide-stage" class="menu-action-btn action-danger" role="menuitem" title="Hide Avatar Stage">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          <span>Hide Stage</span>
        </button>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="stage-loading" class="stage-overlay hidden">
      <div class="spinner"></div>
      <span id="stage-loading-text">Loading VRM Avatar...</span>
    </div>

    <!-- Fallback Indicator -->
    <div id="stage-fallback-notice" class="stage-fallback-badge hidden">
      No VRM loaded — displaying fallback mannequin
    </div>

    <!-- Error Banner -->
    <div id="stage-error" class="stage-error-overlay hidden">
      <span id="stage-error-message">Unable to load VRM model</span>
      <div class="error-actions" style="display: flex; gap: 6px;">
        <button id="stage-error-retry-btn" class="error-action-btn" style="background: rgba(255,255,255,0.15);">Retry</button>
        <button id="stage-error-settings-btn" class="error-action-btn">Settings</button>
      </div>
    </div>
  </div>

  <script type="module" src="./avatar-stage/stage-main.ts"></script>
</body>
</html>
